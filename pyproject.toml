[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-interface"
version = "0.1.0"
description = "Universal AI Interface — one conversational hub connecting tools and services"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Universal AI Interface contributors" }]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.26",
    "litellm>=1.40",
    "chromadb>=0.4",
    "sentence-transformers>=2.3",
    "apscheduler>=3.10",
    "cryptography>=42",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slack_sdk>=3.27",
    "icalendar>=5.0",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
uai = "universal_interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
universal_interface = ["static/*"]
